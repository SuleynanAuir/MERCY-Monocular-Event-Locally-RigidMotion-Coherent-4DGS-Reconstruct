name: Deploy Mercy project page

on:
  push:
    branches: [main]
    paths:
      - 'project_page/**'
      - '.github/workflows/mercy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mercy-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v6
        with:
          sparse-checkout: project_page
      - name: Validate JavaScript
        run: node --check project_page/script.js
      - name: Validate and package the public site
        run: python3 project_page/scripts/build_site.py --output "$RUNNER_TEMP/mercy-site"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/mercy-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
